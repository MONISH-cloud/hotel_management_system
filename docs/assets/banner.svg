<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="t d">
  <title id="t">Maison Aurelia: Hotel Management System</title>
  <desc id="d">Dark banner with gold lettering: Maison Aurelia, a full-stack hotel management system built with Next.js, MySQL, Neo4j and Redis.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07080a"/><stop offset="0.6" stop-color="#0f0e0b"/><stop offset="1" stop-color="#1d1810"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f0dfb8"/><stop offset="0.5" stop-color="#cbab6a"/><stop offset="1" stop-color="#e4cb8e"/></linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.05" r="0.75"><stop offset="0" stop-color="#cbab6a" stop-opacity="0.32"/><stop offset="1" stop-color="#cbab6a" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow2" cx="0.05" cy="1" r="0.6"><stop offset="0" stop-color="#8bb9ec" stop-opacity="0.10"/><stop offset="1" stop-color="#8bb9ec" stop-opacity="0"/></radialGradient>
    <clipPath id="r"><rect width="1280" height="360" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1280" height="360" fill="url(#bg)"/>
    <rect width="1280" height="360" fill="url(#glow)"/>
    <rect width="1280" height="360" fill="url(#glow2)"/>
    <!-- decorative arcs -->
    <g fill="none" stroke="#cbab6a" stroke-opacity="0.16">
      <circle cx="1130" cy="60" r="150"/><circle cx="1130" cy="60" r="210"/><circle cx="1130" cy="60" r="270"/>
    </g>
    <line x1="64" y1="290" x2="1216" y2="290" stroke="#cbab6a" stroke-opacity="0.35"/>
    <!-- logo mark -->
    <circle cx="106" cy="120" r="34" fill="none" stroke="url(#gold)" stroke-width="2"/>
    <g transform="translate(86 100) scale(1.67)" fill="none" stroke="#e4cb8e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 20V9l8-5 8 5v11"/><path d="M9 20v-6h6v6"/><path d="M12 4v3"/>
    </g>
    <text x="64" y="232" font-family="Georgia, 'Times New Roman', serif" font-size="92" fill="#f6f1e7" letter-spacing="-1">Maison <tspan fill="url(#gold)" font-style="italic">Aurelia</tspan></text>
    <text x="68" y="268" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#8f8b82" letter-spacing="7">HOTEL MANAGEMENT SYSTEM</text>
    <!-- stack chips -->
    <g font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">
      <g transform="translate(64 312)"><rect width="104" height="30" rx="15" fill="none" stroke="#cbab6a" stroke-opacity="0.5"/><text x="52" y="20" fill="#e4cb8e">Next.js 16</text></g>
      <g transform="translate(180 312)"><rect width="88" height="30" rx="15" fill="none" stroke="#cbab6a" stroke-opacity="0.5"/><text x="44" y="20" fill="#e4cb8e">MySQL</text></g>
      <g transform="translate(280 312)"><rect width="88" height="30" rx="15" fill="none" stroke="#cbab6a" stroke-opacity="0.5"/><text x="44" y="20" fill="#e4cb8e">Neo4j</text></g>
      <g transform="translate(380 312)"><rect width="88" height="30" rx="15" fill="none" stroke="#cbab6a" stroke-opacity="0.5"/><text x="44" y="20" fill="#e4cb8e">Redis</text></g>
      <g transform="translate(480 312)"><rect width="124" height="30" rx="15" fill="none" stroke="#cbab6a" stroke-opacity="0.5"/><text x="62" y="20" fill="#e4cb8e">TypeScript</text></g>
    </g>
  </g>
</svg>
