name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs of the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Type-check · Lint · Tests · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The 20 database tests need a real MySQL. Neo4j and Redis are not needed for them.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    # Throw-away values that exist only for this run. They are NOT the project's real secrets.
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_ROOT_USER: root
      MYSQL_ROOT_PASSWORD: ci-root-password
      MYSQL_PASSWORD: ci-app-password
      NEO4J_PASSWORD: ci-neo4j-password
      JWT_SECRET: ci-only-jwt-secret-0123456789abcdef0123456789abcdef
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Database and unit tests
        run: npm test

      - name: Production build
        run: npm run build
